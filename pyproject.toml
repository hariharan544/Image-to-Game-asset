[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-assets"
version = "0.1.0"
description = "One image -> game-ready, rigged, multi-part 3D asset (Tripo + Blender + AI supervisor)"
requires-python = ">=3.10"
dependencies = [
  "tripo3d>=1.0,<2",        # official Tripo SDK (apiv3; v2 API was shut down 2026-10-31)
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
