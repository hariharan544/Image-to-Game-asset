# Modular environment pieces: walls, rocks, trees, ruins.
generation: {use_multiview: false, generate_parts: false}
topology: {preserve_hard_edges: true}
uv: {method: smart}
rig: {enabled: false}
tiers:
  hero:       {topology: {target_tris: 20000}, texture: {size: 2048}, uv: {texel_density_px_per_m: 1024}}
  standard:   {topology: {target_tris: 6000},  texture: {size: 2048}, uv: {texel_density_px_per_m: 512}}
  background: {topology: {target_tris: 1500},  texture: {size: 1024}, uv: {texel_density_px_per_m: 256}}
