# Bipedal characters: heroes, NPCs, enemies.
generation: {use_multiview: true, generate_parts: true}
topology: {symmetry_x: true, preserve_hard_edges: false}
uv: {method: min_stretch}
rig: {enabled: true, rig_type: biped}
tiers:                      # AAA budgets (Unreal)
  hero:       {topology: {target_tris: 80000}, texture: {size: 4096}, uv: {texel_density_px_per_m: 1024}}
  standard:   {topology: {target_tris: 40000}, texture: {size: 2048}, uv: {texel_density_px_per_m: 512}}
  background: {topology: {target_tris: 15000}, texture: {size: 1024}, uv: {texel_density_px_per_m: 256}}
mobile:                     # mobile budgets (Unity)
  hero:       {topology: {target_tris: 15000}, texture: {size: 2048}, uv: {texel_density_px_per_m: 512}}
  standard:   {topology: {target_tris: 7000}, texture: {size: 1024}, uv: {texel_density_px_per_m: 256}}
  background: {topology: {target_tris: 2500}, texture: {size: 512}, uv: {texel_density_px_per_m: 128}}
