# Static props: furniture, crates, pickups, set dressing.
generation: {use_multiview: false, generate_parts: false}
topology: {preserve_hard_edges: true}
uv: {method: smart}
rig: {enabled: false}
tiers:                      # AAA budgets (Unreal)
  hero:       {topology: {target_tris: 12000}, texture: {size: 2048}, uv: {texel_density_px_per_m: 1024}}
  standard:   {topology: {target_tris: 4000},  texture: {size: 1024}, uv: {texel_density_px_per_m: 512}}
  background: {topology: {target_tris: 800},   texture: {size: 512},  uv: {texel_density_px_per_m: 256}}
mobile:                     # mobile budgets (Unity)
  hero:       {topology: {target_tris: 2000}, texture: {size: 1024}, uv: {texel_density_px_per_m: 512}}
  standard:   {topology: {target_tris: 800}, texture: {size: 512}, uv: {texel_density_px_per_m: 256}}
  background: {topology: {target_tris: 200}, texture: {size: 256}, uv: {texel_density_px_per_m: 128}}
